name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew
      - name: Build NeoForge mod
        run: ./gradlew clean :neoforge:test :neoforge:build
      - name: Upload JUnit reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Ingot-test-reports.${{ github.run_number }}
          path: neoforge/build/test-results/test/*.xml
          if-no-files-found: ignore
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ingot-build.${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
